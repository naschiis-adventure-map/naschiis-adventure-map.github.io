name: Streams und Clips aktualisieren

on:
  schedule:
    # alle 15 Minuten: erfasst laufende Streams (Zuschauer, Dauer) und neue Clips.
    # Ungerade Minuten, weil GitHub zur vollen Viertelstunde überlastet ist und Läufe dann oft ausfallen.
    # Zuverlässiger Takt kommt von außen: Google Apps Script (scripts/google-apps-script.gs) stößt alle 15 Min. an.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Für jeden Stream einzeln nach Clips suchen (einmaliger Nachhol-Lauf)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Twitch abfragen
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
        run: node scripts/update.mjs
      - name: Prüfen, ob sich Daten geändert haben
        id: changed
        run: |
          if [ -f .og-needed ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Teilen-Vorschaubild (og.png) erzeugen
        if: steps.changed.outputs.yes == 'true'
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/og.mjs
          rm -f .og-needed
      - name: Vorschaubild-Version in index.html eintragen
        run: node scripts/og-version.mjs
      - name: Änderungen speichern
        id: save
        run: |
          if git diff --quiet -- data og.png favicon.png apple-touch-icon.png index.html && [ -z "$(git ls-files --others --exclude-standard og.png favicon.png apple-touch-icon.png)" ]; then echo "Keine neuen Daten."; exit 0; fi
          git config user.name "adventure-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data og.png index.html
          git add favicon.png apple-touch-icon.png 2>/dev/null || true
          git commit -m "Daten aktualisiert: $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Falls zwischendurch jemand anderes gepusht hat: neuesten Stand holen und erneut versuchen
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  # Neue Daten gleich veröffentlichen
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      soft: true
