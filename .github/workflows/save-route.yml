name: Route speichern

# Wird vom Google Apps Script angestoßen, nachdem es Twitch-Login und Bearbeitungsrecht geprüft hat.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Route als JSON ({ id, route, by })'
        required: true

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prüfen und speichern
        id: save
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          git config user.name "adventure-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Bei gleichzeitigen Änderungen: neuesten Stand holen, Route neu eintragen, erneut versuchen
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/save-route.mjs || exit 1
            git add data/routes.json data/status.json
            git diff --cached --quiet && { echo "Keine Änderung."; exit 0; }
            git commit -qm "$(git diff --cached --quiet -- data/status.json && echo 'Route gespeichert' || echo 'Seitenstatus geändert')"
            git push -q origin HEAD:main && { echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep $((RANDOM % 6 + 3))
          done
          exit 1

  # Gespeicherte Route gleich veröffentlichen
  publish:
    needs: save
    if: needs.save.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
